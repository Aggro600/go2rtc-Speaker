# go2rtc / Frigate config – Reolink doorbell with two-way audio
# The RTSP source is what provides the backchannel (audio towards the camera).
go2rtc:
  streams:
    front_door:
      - "ffmpeg:http://192.168.1.20/flv?port=1935&app=bcs&stream=channel0_main.bcs&user=admin&password=YOUR_PASSWORD#video=copy#audio=copy#audio=opus"
      - rtsp://admin:YOUR_PASSWORD@192.168.1.20:554/h264Preview_01_main
