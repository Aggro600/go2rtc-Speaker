# scripts.yaml – reusable template: speak a text at the front door
front_door_tts:
  alias: Front door TTS
  icon: mdi:account-voice
  mode: queued
  fields:
    message:
      name: Message
      required: true
      example: Please leave the parcel in front of the door.
      selector:
        text:
          multiline: true
  sequence:
    - action: tts.speak
      target:
        entity_id: tts.google_cloud   # any TTS entity
      data:
        media_player_entity_id: media_player.front_door_speaker
        message: "{{ message }}"
